spring.application.name=citasmedicas
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:citas}
spring.datasource.username=${POSTGRES_USER:citas}
spring.datasource.password=${POSTGRES_PASSWORD:citas}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
citas.mail.remitente=${MAIL_FROM:no-reply@citas-medicas.local}

management.endpoints.web.exposure.include=health,modulith
management.endpoint.health.show-components=always
